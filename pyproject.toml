[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collateral-opt"
version = "0.1.0"
description = "Collateral optimisation: allocate inventory to margin requirements at minimum cost"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
collateral-opt = "collateral_opt.cli:main"
collateral-opt-web = "collateral_opt.web:main"

[tool.setuptools]
packages = ["collateral_opt"]

[tool.setuptools.package-data]
collateral_opt = ["static/*"]
